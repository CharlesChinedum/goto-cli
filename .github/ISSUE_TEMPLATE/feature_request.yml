name: Feature request
description: Suggest a new subcommand, flag, or improvement
title: "[Feature]: "
labels:
    - enhancement
body:
    - type: markdown
      attributes:
          value: |
              Thanks for the suggestion! gotocli aims to stay small and dependency-free, so proposals that keep the single-binary, cross-platform design are the easiest to accept.

    - type: textarea
      id: problem
      attributes:
          label: What problem are you trying to solve?
          description: Describe the situation where the current commands (`add`, `list`, `jump`, `remove`, `edit`, `rename`) fall short.
      validations:
          required: true

    - type: textarea
      id: proposal
      attributes:
          label: Proposed solution
          description: What would the command or behaviour look like? Include an example invocation and its output if you can.
          render: shell
      validations:
          required: true

    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives you considered
          description: Other ways this could work, or workarounds you use today.

    - type: checkboxes
      id: platforms
      attributes:
          label: Platforms
          description: Which platforms have you thought about for this feature?
          options:
              - label: macOS / Linux (bash or zsh wrapper)
              - label: Windows (PowerShell wrapper)

    - type: checkboxes
      id: contribute
      attributes:
          label: Contribution
          options:
              - label: I am willing to open a pull request for this
