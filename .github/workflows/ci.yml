name: CI

on:
    push:
        branches:
            - main
            - development
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: go.mod

            - name: Build
              run: go build -o /dev/null ./app

            - name: Vet
              run: go vet ./...

            - name: Check formatting
              run: |
                  unformatted=$(gofmt -l .)
                  if [ -n "$unformatted" ]; then
                      echo "The following files are not gofmt-formatted:"
                      echo "$unformatted"
                      exit 1
                  fi

            - name: Test
              run: go test ./...

            - name: Cross-compile all release targets
              run: |
                  GOOS=darwin GOARCH=amd64 go build -o /dev/null app/main.go
                  GOOS=darwin GOARCH=arm64 go build -o /dev/null app/main.go
                  GOOS=linux GOARCH=amd64 go build -o /dev/null app/main.go
                  GOOS=windows GOARCH=amd64 go build -o /dev/null app/main.go
